[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradecard-core"
version = "0.1.0"
description = "面向机械工程师的纯 Python 工程计算库：ISO 286 公差配合、硬度/单位换算、轴梁校核、螺栓预紧力、齿轮轴承配合、材料工艺知识库"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GradeCard" }]
keywords = ["tolerance", "ISO 286", "fits", "engineering", "hardness", "bolt preload", "GB standards", "mechanical design"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://gradecard.online"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
